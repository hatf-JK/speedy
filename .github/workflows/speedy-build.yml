name: ParadoxForge Speedy CI/CD Build

on:
  workflow_dispatch: # Allows manual 1-click execution from GitHub Mobile or Web
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -------------------------------------------------------------------------
      # SANITIZATION STAGE: Neutralize Hardcoded Developer macOS Paths
      # -------------------------------------------------------------------------
      - name: Sanitize Environment & Purge Hardcoded Mac Paths
        run: |
          echo "=== Auditing Project for Hardcoded Host Paths ==="

          # 1. Remove local.properties if checked in erroneously by the upstream dev
          if [ -f local.properties ]; then
            echo "Removing committed local.properties..."
            rm -f local.properties
          fi

          # 2. Strip org.gradle.java.home from gradle.properties if present
          if [ -f gradle.properties ]; then
            echo "Checking gradle.properties for hardcoded java.home..."
            sed -i '/org.gradle.java.home/d' gradle.properties
            grep "org.gradle.java.home" gradle.properties || echo "Clean: No java.home overrides remain in gradle.properties"
          fi

          # 3. Ensure gradlew wrapper script has executable permissions on Linux
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      # -------------------------------------------------------------------------
      # TOOLCHAIN STAGE: Setup Java & Android SDK
      # -------------------------------------------------------------------------
      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------------------------------
      # BUILD STAGE: Compile Unsigned Release APK
      # -------------------------------------------------------------------------
      - name: Compile Release APK via Gradle Wrapper
        run: |
          # Build release APK ignoring any daemon caching issues
          ./gradlew assembleRelease --no-daemon --stacktrace

      # -------------------------------------------------------------------------
      # SIGNING STAGE: Cryptographic Alignment & Signing with CipherParadox Key
      # -------------------------------------------------------------------------
      - name: Align and Sign APK (v2 + v3 Scheme)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/paradox-release.jks

          # Locate the compiled APK regardless of subproject directory structure
          RAW_APK=$(find . -path "*/build/outputs/apk/*" -name "*release*.apk" ! -name "*unaligned*" | head -n 1)
          echo "Discovered Release APK: $RAW_APK"

          # Find the latest available build-tools in the runner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # 4-byte page-alignment for optimal Android memory mapping (mmap)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" /tmp/aligned.apk

          # Sign with your personal RSA-4096 CipherParadox certificate
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/paradox-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out speedy-paradox-release.apk \
            /tmp/aligned.apk

          # Cryptographic validation of the final signature
          echo "=== Signature Verification ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs speedy-paradox-release.apk

          # Clean up temporary sensitive artifacts from runner disk
          rm -f /tmp/paradox-release.jks /tmp/aligned.apk

      # -------------------------------------------------------------------------
      # PUBLISH STAGE: Deploy to GitHub Releases for Immediate Download
      # -------------------------------------------------------------------------
      - name: Create GitHub Release & Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate a clean timestamped build tag
          BUILD_TAG="v1.0.$(date +'%Y%m%d%H%M')"
          echo "Publishing Release: $BUILD_TAG"

          gh release create "$BUILD_TAG" speedy-paradox-release.apk \
            --repo "${{ github.repository }}" \
            --title "Speedy Build ($BUILD_TAG)" \
            --notes "Automated GitHub Actions build of Speedy. Sanitized macOS paths and signed with CipherParadox keypair."
