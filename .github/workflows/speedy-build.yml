name: ParadoxForge Speedy CI/CD Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -------------------------------------------------------------------------
      # 1. PURGE DEVELOPER MAC PATHS FROM REPO
      # -------------------------------------------------------------------------
      - name: Sanitize Environment & Purge Hardcoded Mac Paths
        run: |
          echo "=== Cleaning hardcoded local host properties ==="
          rm -f local.properties
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          chmod +x gradlew

      # -------------------------------------------------------------------------
      # 2. SETUP JAVA 21 (MANDATORY FOR AGP 8.8 & GRADLE 8.11)
      # -------------------------------------------------------------------------
      - name: Setup Java JDK (Temurin 21 via setup-java v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # -------------------------------------------------------------------------
      # 3. VERIFY PRE-INSTALLED RUNNER ANDROID SDK
      # -------------------------------------------------------------------------
      - name: Verify Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME is set to: $ANDROID_HOME"
          ls -l "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # -------------------------------------------------------------------------
      # 4. COMPILE RELEASE APK (EXPLICIT :app MODULE TARGET)
      # -------------------------------------------------------------------------
      - name: Compile Release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # -------------------------------------------------------------------------
      # 5. ALIGN & SIGN WITH CIPHERPARADOX KEYSTORE
      # -------------------------------------------------------------------------
      - name: Align and Sign APK with CipherParadox Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/paradox-release.jks

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" ! -name "*unaligned*" | head -n 1)
          fi
          echo "Located compiled APK at: $RAW_APK"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" /tmp/aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/paradox-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out speedy-paradox-release.apk \
            /tmp/aligned.apk

          echo "=== Verifying Cryptographic Signature ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs speedy-paradox-release.apk

          rm -f /tmp/paradox-release.jks /tmp/aligned.apk

      # -------------------------------------------------------------------------
      # 6. PUBLISH SIGNED RELEASE FOR OBTAINIUM
      # -------------------------------------------------------------------------
      - name: Publish Signed Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_TAG="v1.0.$(date +'%Y%m%d%H%M')"
          gh release create "$BUILD_TAG" speedy-paradox-release.apk \
            --repo "${{ github.repository }}" \
            --title "Speedy Network Monitor ($BUILD_TAG)" \
            --notes "Automated release compiled on JDK 21 and signed with CipherParadox certificate."
